# Publie l'app sur GitHub Pages à chaque push sur main,
# en inscrivant le commit dans version.json (affiché dans Réglages).
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html app.js logic.js sw.js manifest.webmanifest icon-*.png vendor _site/
          SHORT="${GITHUB_SHA::7}"
          DATE="$(git log -1 --format=%cI)"
          printf '{"sha":"%s","short":"%s","date":"%s"}\n' "$GITHUB_SHA" "$SHORT" "$DATE" > _site/version.json
          sed -i "s/__BUILD__/$SHORT/" _site/sw.js
          cat _site/version.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
